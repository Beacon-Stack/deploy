# Add-on: FlareSolverr, for indexers behind Cloudflare bot protection
# (1337x, kickasstorrents, ...). Most people don't need this.
#
#   docker compose -f docker-compose.yml -f docker-compose.flaresolverr.yml up -d
#
# Combine with the VPN add-on by passing both -f files.

services:

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info

  pulse:
    environment:
      PULSE_FLARESOLVERR_URL: http://flaresolverr:8191
