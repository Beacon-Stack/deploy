name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate with flaresolverr profile
        env:
          COMPOSE_PROFILES: flaresolverr
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate dev compose (base + dev override)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  pg2sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pg2sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pg2sqlite/go.mod
          cache: true
          cache-dependency-path: pg2sqlite/go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -timeout 60s ./...

      # The integration test spins up postgres:17-alpine via the docker
      # CLI; GitHub-hosted runners ship with docker available.
      - name: Integration test
        run: go test -tags=integration -timeout 3m ./...
