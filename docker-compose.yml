# Beacon Stack — self-hosted media management — https://beaconstack.io
#
#   1. Edit the SETTINGS block below (media paths + API key).
#   2. docker compose up -d
#   3. Open Pulse at http://localhost:9696
#
# Optional add-ons live in their own files: docker-compose.vpn.yml and
# docker-compose.flaresolverr.yml. See README.md.

# ─── SETTINGS — the only part you need to edit ──────────────────────────────
x-settings:
  # Host directories for your media. Keep all three on the SAME filesystem
  # (e.g. /opt/media/{tv,movies,downloads}) so imports are instant hardlinks
  # instead of slow copies.
  tv:        &tv        /opt/media/tv:/tv
  movies:    &movies    /opt/media/movies:/movies
  downloads: &downloads /opt/media/downloads:/downloads

  # One shared key the four services use to talk to each other. Replace with
  # any long random string, e.g. the output of:  openssl rand -hex 32
  api-key:   &api-key   change-me-to-a-long-random-string

  # Your timezone, e.g. America/New_York, Europe/Berlin.
  timezone:  &timezone  UTC
# ────────────────────────────────────────────────────────────────────────────

services:

  pulse:                                   # control plane — http://localhost:9696
    image: ghcr.io/beacon-stack/pulse:latest
    container_name: pulse
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      TZ: *timezone
      PULSE_AUTH_API_KEY: *api-key
    volumes:
      - ./config/pulse:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9696/health"]
      interval: 15s
      start_period: 20s

  pilot:                                   # TV series — http://localhost:8383
    image: ghcr.io/beacon-stack/pilot:latest
    container_name: pilot
    restart: unless-stopped
    ports:
      - "8383:8383"
    environment:
      TZ: *timezone
      PILOT_PULSE_URL: http://pulse:9696
      PILOT_PULSE_API_KEY: *api-key
    volumes:
      - ./config/pilot:/config
      - *tv
      - *downloads
    depends_on:
      pulse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8383/health"]
      interval: 15s
      start_period: 20s

  prism:                                   # movies — http://localhost:8282
    image: ghcr.io/beacon-stack/prism:latest
    container_name: prism
    restart: unless-stopped
    ports:
      - "8282:8282"
    environment:
      TZ: *timezone
      PRISM_PULSE_URL: http://pulse:9696
      PRISM_PULSE_API_KEY: *api-key
    volumes:
      - ./config/prism:/config
      - *movies
      - *downloads
    depends_on:
      pulse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8282/health"]
      interval: 15s
      start_period: 20s

  haul:                                    # BitTorrent client — http://localhost:8484
    image: ghcr.io/beacon-stack/haul:latest
    container_name: haul
    restart: unless-stopped
    ports:
      - "8484:8484"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      TZ: *timezone
      HAUL_AUTH_API_KEY: *api-key
      HAUL_PULSE_URL: http://pulse:9696
      HAUL_PULSE_API_KEY: *api-key
    volumes:
      - ./config/haul:/config
      - *downloads
    depends_on:
      pulse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8484/health"]
      interval: 15s
      start_period: 30s
